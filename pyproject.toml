[project]
name = "visualnn"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle==3.1.2",
    "matplotlib==3.11.2",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tensorboard==2.21.0",
    "tqdm==4.70.1",
    # Select the CPU/CUDA build at installation time for each machine.
    "torch",
    "torchaudio",
    "torchvision",
]

[project.scripts]
visualnn = "visualnn:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
# Prevent `uv run` from re-syncing a CUDA-enabled PyTorch installation
# against uv.lock and replacing it with a CPU build.
managed = false

[tool.uv.pip]
# Used by `uv pip` commands; setup.ps1 also passes this explicitly.
torch-backend = "auto"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
