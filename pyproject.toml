[project]
name = "visualnn"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cloudpickle==3.1.2",
    "matplotlib==3.11.2",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tensorboard==2.21.0",
    "tqdm==4.70.1",
    "torch",
    "torchaudio",
    "torchvision",
    "prefetch-dataloader",
]

[project.scripts]
visualnn = "visualnn:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
managed = true

[tool.uv.sources]
torch = [{ index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
prefetch-dataloader = { git = "https://github.com/Isasa2357/PrefetchDataLoader.git", rev = "main" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
