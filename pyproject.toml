[project]
name = "visualnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Main packages from the existing environment.
    "cloudpickle==3.1.2",
    "matplotlib==3.11.2",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tensorboard==2.21.0",
    "tqdm==4.70.1",

    # Select a suitable PyTorch CUDA/CPU distribution on each PC.
    # Do not pin a local build suffix such as +cu130.
    "torch",
    "torchaudio",
    "torchvision",
]

[project.scripts]
visualnn = "visualnn:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv.pip]
# Used by 'uv pip' commands, not 'uv sync' or 'uv add'.
torch-backend = "auto"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
